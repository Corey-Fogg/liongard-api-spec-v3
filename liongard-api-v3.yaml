    inspectorUiConfigTemplateUpsertRequest:
      type: object
      additionalProperties: false
      required:
      - fields
      properties:
        fields:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/inspectorUiConfigField'
    inspectorAuthentication:
      type: object
      additionalProperties: false
      required:
      - inspectorId
      - type
      - updatedAt
      description: 'Declarative description of how the inspector authenticates
        against the vendor API. The runtime auth client is built from this
        definition — no inspector code needs to be written for the supported
        flows.

        '
      properties:
        inspectorId:
          type: string
          examples:
          - inspector_13
        type:
          type: string
          enum:
          - apiKey
          - basic
          - bearer
          - oauth2ClientCredentials
          - oauth2AuthorizationCode
          - oauth2Password
          - ssh
          - custom
          description: 'Auth flow:

            - `apiKey` — single header with templated value

            - `basic` — HTTP Basic with user/pass from UI fields

            - `bearer` — static bearer token from a UI field

            - `oauth2ClientCredentials` — server-to-server OAuth flow

            - `oauth2AuthorizationCode` — user-redirect OAuth flow

            - `oauth2Password` — legacy resource-owner password OAuth flow

            - `ssh` — SSH key + host/port

            - `custom` — caller supplies a JS-style snippet (advanced)

            '
        baseUrl:
          type: string
          format: uri
          description: Base URL of the vendor API. May be overridden per-launchpoint
            via a `*_BASE_URL` ui-config field.
        header:
          type: string
          description: HTTP header that carries the credential. Defaults to
            `Authorization` for bearer/basic and the value of `header` for apiKey.
        headerFormat:
          type: string
          description: 'Templated header value with `{fieldName}` placeholders that
            reference ui-config fields. Examples:

            - `Bearer {ACCESS_TOKEN}`

            - `ApiKey {ACME_API_KEY}`

            - `{SENTEON_API_KEY_ID}:{SENTEON_API_KEY_SECRET}`

            '
          examples:
          - Bearer {ACCESS_TOKEN}
        tokenEndpoint:
          type: string
          description: Absolute or relative URL for the token endpoint (OAuth flows).
          examples:
          - /oauth/token
        tokenMethod:
          type: string
          enum:
          - GET
          - POST
          default: POST
        tokenContentType:
          type: string
          default: application/x-www-form-urlencoded
        tokenResponsePath:
          type: string
          default: access_token
          description: Path within the token endpoint response to extract the
            access token (e.g. `access_token`, `data.token`).
        tokenExpiryPath:
          type: string
          default: expires_in
          description: Path within the token endpoint response to extract the
            expiry (in seconds). When absent, the inspector refreshes on the next
            401.
        tokenParameters:
          type: object
          additionalProperties:
            type: string
          description: 'Static body/query parameters for the token request. Use
            `{fieldName}` placeholders to substitute ui-config values.

            '
          examples:
          - client_id: '{ACME_CLIENT_ID}'
            client_secret: '{ACME_CLIENT_SECRET}'
            grant_type: client_credentials
        credentialFields:
          type: array
          items:
            type: string
          description: Names of ui-config fields used by this auth flow. Used by
            the builder to validate that the ui-config template provides every
            value referenced in `headerFormat` / `tokenParameters`.
          examples:
          - - ACME_CLIENT_ID
            - ACME_CLIENT_SECRET
        refreshOnExpiry:
          type: boolean
          default: true
        retryOn401:
          type: boolean
          default: true
          description: Whether to refresh the token and retry once when a 401 is
            received.
        customSnippet:
          type: string
          description: 'JavaScript-style snippet used only when `type=custom`. The
            snippet receives `{ job, request }` and must mutate `request.headers`.
            Reviewed before publish.

            '
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
    inspectorAuthenticationUpsertRequest:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - apiKey
          - basic
          - bearer
          - oauth2ClientCredentials
          - oauth2AuthorizationCode
          - oauth2Password
          - ssh
          - custom
        baseUrl:
          type: string
          format: uri
        header:
          type: string
        headerFormat:
          type: string
        tokenEndpoint:
          type: string
        tokenMethod:
          type: string
          enum:
          - GET
          - POST
        tokenContentType:
          type: string
        tokenResponsePath:
          type: string
        tokenExpiryPath:
          type: string
        tokenParameters:
          type: object
          additionalProperties:
            type: string
        credentialFields:
          type: array
          items:
            type: string
        refreshOnExpiry:
          type: boolean
        retryOn401:
          type: boolean
        customSnippet:
          type: string
    inspectorPaginationStrategy:
      type: object
      additionalProperties: false
      required:
      - type
      description: Reusable pagination strategy attached to one or more endpoints.
      properties:
        type:
          type: string
          enum:
          - none
          - offsetLimit
          - pageSize
          - cursor
          - linkHeader
          - custom
        limitParam:
          type: string
          default: limit
        offsetParam:
          type: string
          default: offset
        pageParam:
          type: string
          default: page
        sizeParam:
          type: string
          default: size
        cursorParam:
          type: string
          description: Query parameter name that carries the cursor on subsequent
            requests (e.g. `cursor`, `after`, `nextPageToken`).
        cursorResponsePath:
          type: string
          description: Path within the response body that carries the next cursor.
        nextUrlPath:
          type: string
          description: Path within the response body that carries an absolute URL
            for the next page (alternative to `cursorResponsePath`).
        totalPath:
          type: string
          description: Path within the response body that carries the total count.
        hasMorePath:
          type: string
          description: Path within the response body that carries a boolean
            indicating more pages exist.
        maxPerPage:
          type: integer
          minimum: 1
          maximum: 10000
          default: 100
        customSnippet:
          type: string
          description: 'JavaScript-style snippet used only when `type=custom`.
            Receives `{ previousResponse, baseUrl }` and returns
            `{ nextUrl: string | null, done: boolean }`.

            '
    inspectorRateLimit:
      type: object
      additionalProperties: false
      description: Per-endpoint client-side rate limit configuration.
      properties:
        minTimeMs:
          type: integer
          minimum: 0
          description: Minimum milliseconds between requests (e.g. 1000 = 60
            req/min).
        maxConcurrent:
          type: integer
          minimum: 1
          default: 1
        retryAfterHeader:
          type: string
          default: Retry-After
          description: Response header to honor on 429 responses.
        maxRetries:
          type: integer
          minimum: 0
          default: 3
    inspectorEndpointDefinition:
      type: object
      additionalProperties: false
      required:
      - endpointDefId
      - inspectorId
      - name
      - urlTemplate
      - role
      - updatedAt
      description: 'A single HTTP call the inspector makes against the vendor
        API. Endpoints are categorized by `role` — preflight endpoints run first
        to gather ids, extract endpoints fetch the data, discovery endpoints
        feed the parent/child discovery list, and children are fanned-out per
        parent row.

        '
      properties:
        endpointDefId:
          type: string
          examples:
          - epd_users_list
        inspectorId:
          type: string
        name:
          type: string
          description: 'Logical name of the endpoint within the inspector
            (e.g. Users, DeviceIDs, Tenants). Appears in the resolved dataprint
            as the top-level key for this endpoint''s data and as the dependency
            handle for `dependsOn`.

            '
          maxLength: 100
          examples:
          - Users
        description:
          type: string
        role:
          type: string
          enum:
          - preflight
          - extract
          - discovery
          - child
          description: 'Pipeline phase:

            - `preflight` — runs first, supplies ids/cursors consumed by
            extract endpoints

            - `extract` — main data fetch, written to the dataprint

            - `discovery` — emits the parent/child Discovered[] list

            - `child` — fanned-out per parent row of another endpoint via
            `parentEndpoint`

            '
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          default: GET
        urlTemplate:
          type: string
          description: 'URL relative to `authentication.baseUrl`. `{fieldName}`
            placeholders reference ui-config fields, `{parent.X}` placeholders
            reference fields on the parent row (for `role=child`), and
            `{preflight.Endpoint[index]}` references preflight data.

            '
          examples:
          - /v1/users/{ACME_TENANT_ID}/details
        bodyTemplate:
          type: object
          additionalProperties: true
          description: 'Templated request body. Same `{placeholder}` rules apply.
            Use `{preflight.UserIDs}` to inject the entire preflight array.

            '
        queryParams:
          type: object
          additionalProperties:
            type: string
          description: Additional query parameters merged onto the URL with the
            same placeholder substitution rules as `urlTemplate`.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Extra request headers beyond the auth header.
        pagination:
          $ref: '#/components/schemas/inspectorPaginationStrategy'
        rateLimit:
          $ref: '#/components/schemas/inspectorRateLimit'
        valuePath:
          type: string
          description: 'JSONPath/JMESPath to the array (or value) of interest
            inside the response. Default is the response root.

            '
          examples:
          - data
        transformResponse:
          type: string
          description: 'Optional JMESPath expression applied to the response
            before storage. Use for filtering, reshaping, or unwrapping
            envelopes.

            '
        errorCodesToIgnore:
          type: array
          items:
            type: integer
          description: HTTP status codes that should be swallowed (logged but not
            failing the inspection). Common values are 403, 404 for scope-gated
            endpoints.
          examples:
          - - 403
            - 404
        extractEnabled:
          type: string
          description: 'Optional RSQL expression evaluated against `job.Data` and
            the discovery context. When present, the endpoint runs only if the
            expression evaluates true. Example: `ACME_TENANT_ID==null` to run
            only on parent launchpoints.

            '
        dependsOn:
          type: array
          items:
            type: string
          description: Names of endpoints whose results must be available before
            this one can be templated and run.
        parentEndpoint:
          type: string
          description: 'For `role=child` only. Name of the parent endpoint whose
            response array is fanned-out. Each row becomes the substitution
            context for `{parent.X}` placeholders.

            '
        attachAs:
          type: string
          description: For `role=child` only. Property name attached to each
            parent row.
        retryPolicy:
          type: object
          additionalProperties: false
          properties:
            maxRetries:
              type: integer
              minimum: 0
              default: 3
            backoffMs:
              type: integer
              minimum: 0
              default: 1000
            backoffStrategy:
              type: string
              enum:
              - linear
              - exponential
              default: exponential
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
    inspectorEndpointDefinitionCreateRequest:
      type: object
      additionalProperties: false
      required:
