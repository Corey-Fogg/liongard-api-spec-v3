components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication
  parameters:
    alertId:
      name: alertId
      in: path
      required: true
      schema:
        type: string
      description: Unique alert identifier
    assetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
      description: Unique asset identifier
    dataprintId:
      name: dataprintId
      in: path
      required: true
      schema:
        type: string
      description: Unique dataprint identifier
    environmentId:
      name: environmentId
      in: path
      required: true
      schema:
        type: string
      description: Unique environment identifier
    expand:
      name: expand
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      description: 'Dynamic expansions for nested fields. No expand-all wildcard supported.

        Use /v3/meta endpoints to discover supported expansion values for each resource
        type.


        Example: expand=environment&expand=inspector

        '
    filter:
      name: filter
      in: query
      required: false
      schema:
        type: string
      description: 'Filter results using RSQL (RESTful Service Query Language) syntax.


        **Operators:**

        - `==` - Equal

        - `!=` - Not equal

        - `>` - Greater than

        - `>=` - Greater than or equal

        - `<` - Less than

        - `<=` - Less than or equal

        - `=in=` - In list (e.g., `status=in=(pending,processing)`)

        - `=out=` - Not in list

        - Wildcards: `*` for pattern matching (e.g., `name==*server*`)


        **Combinators:**

        - `;` - AND

        - `,` - OR

        - `()` - Grouping


        **Examples:**

        - `status==active`

        - `priority==critical;status==open`

        - `status=in=(pending,processing)`

        - `createdAt>=2024-01-01;createdAt<2024-02-01`

        - `name==*server*,name==*router*`

        - `environmentId==env_8888;(status==open,status==in_progress)`


        Consult /v3/meta/objects to discover filterable fields per resource type.

        '
    identityId:
      name: identityId
      in: path
      required: true
      schema:
        type: string
      description: Unique identity identifier
    inspectorId:
      name: inspectorId
      in: path
      required: true
      schema:
        type: string
      description: 'Unique inspector identifier. This ID is global and consistent
        across environments.

        '
    jobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
      description: Unique job identifier
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      description: Maximum number of results to return (1-1000)
    metricId:
      name: metricId
      in: path
      required: true
      schema:
        type: string
      description: Unique metric identifier
    offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of results to skip for pagination
    sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: 'Field name to sort by. Prefix with ''-'' for descending order.


        Examples:

        - sort=createdAt (ascending)

        - sort=-updatedAt (descending)

        '
    strictExpand:
      name: strictExpand
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: 'If true, unsupported expand values return HTTP 422.

        If false, unsupported expand values are ignored with warnings in response.

        '
    subscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
      description: Unique webhook subscription identifier
    systemId:
      name: systemId
      in: path
      required: true
      schema:
        type: string
      description: Unique system identifier (from inspector dataprints)
  responses:
    badRequest:
      description: Bad Request - invalid request format or parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
    notFound:
      description: Not Found - resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
    rateLimited:
      description: Too Many Requests - rate limit exceeded
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Maximum requests allowed per window
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Requests remaining in current window
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix timestamp when the rate limit resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
    unauthorized:
      description: Unauthorized - invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
    unprocessableEntity:
      description: Unprocessable Entity - request valid but cannot be processed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
  schemas:
    alert:
      type: object
      additionalProperties: false
      required:
      - alertId
      - environmentId
      - name
      - status
      - updatedAt
      properties:
        alertId:
          type: string
          description: Unique alert identifier
          examples:
          - alert_7586
        environmentId:
          type: string
          description: Environment this alert belongs to
          examples:
          - env_8888
        commonId:
          type: string
          description: Common identifier for grouping related alerts (e.g., ticket
            system ID)
          examples:
          - T20210920.00001
        category:
          type: string
          description: Alert category or classification (e.g., security, compliance,
            performance)
          examples:
          - security
        name:
          type: string
          description: Alert title or summary
          examples:
          - Critical vulnerability detected
          maxLength: 255
        description:
          type: string
          description: Detailed alert description
          examples:
          - Multiple systems missing critical security patches
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
          description: Alert priority level
          examples:
          - critical
        source:
          type: string
          description: Source system or integration that created the alert
          examples:
          - liongard-inspector
          maxLength: 100
        owner:
          type: string
          description: User ID or email of the person/team responsible for the alert
          examples:
          - user@example.com
        percentComplete:
          type: integer
          minimum: 0
          maximum: 100
          description: Progress percentage (0-100)
          examples:
          - 45
          default: 0
        autoClose:
          type: integer
          minimum: 0
          description: Days until auto-close (0 = disabled)
          examples:
          - 30
          default: 0
        status:
          type: string
          enum:
          - open
          - in_progress
          - resolved
          - closed
          description: Current alert status
          examples:
          - open
        roarStatus:
          type: integer
          description: Internal ROAR system status code
          examples:
          - 0
        keywords:
          type: string
          description: Comma-separated keywords for search/filtering
          examples:
          - security,patch,vulnerability
          maxLength: 500
        startDate:
          type: string
          format: date-time
          description: Alert start timestamp (UTC, ISO 8601)
          examples:
          - '2024-01-15T10:30:00Z'
        dueDate:
          type: string
          format: date-time
          description: Alert due date (UTC, ISO 8601)
          examples:
          - '2024-02-15T10:30:00Z'
        externalId:
          type: integer
          description: External system identifier (e.g., PSA ticket number)
          examples:
          - 12345
        inspectorId:
          type: string
          description: Inspector that generated this alert (if applicable)
          examples:
          - inspector_13
        timelineId:
          type: string
          description: Timeline/dataprint ID that triggered this alert
          examples:
          - timeline_1294715
        launchpointId:
          type: string
          description: Launchpoint (inspection configuration) that generated this
            alert
          examples:
          - launchpoint_18700
        visible:
          type: boolean
          description: Whether alert is visible in UI
          examples:
          - true
          default: true
        createdBy:
          type: string
          description: User ID or email who created the alert
          examples:
          - system@liongard.com
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (UTC, ISO 8601)
          examples:
          - '2024-01-15T10:30:00Z'
        updatedBy:
          type: string
          description: User ID or email who last updated the alert
          examples:
          - user@example.com
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp (UTC, ISO 8601)
          examples:
          - '2024-01-20T14:45:00Z'
        closedAt:
          type: string
          format: date-time
          description: When the alert was closed (UTC, ISO 8601)
          examples:
          - '2024-01-25T09:00:00Z'
        closedBy:
          type: string
          description: User ID or email who closed the alert
          examples:
          - user@example.com
        details:
          type: object
          additionalProperties: true
          description: Additional alert-specific data and metadata
          examples:
          - affectedSystems:
            - system_1
            - system_2
            severity_score: 8.5
    alertCreateRequest:
