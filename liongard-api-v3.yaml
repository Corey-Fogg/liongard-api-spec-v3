          - cloud
          - networking
          - appservices
          - database
          - identity
          - backup
          description: Inspector category for organization and discovery
        author:
          type: string
          description: Inspector author or vendor name
          examples:
          - Acme Integrations
        contactEmail:
          type: string
          format: email
          description: Support contact email
        helpLink:
          type: string
          format: uri
          description: Documentation URL
        logo:
          type: string
          format: uri
          description: Logo image URL
        icon:
          type: string
          format: uri
          description: Icon image URL
        defaultFrequency:
          type: object
          description: Recommended run frequency
          properties:
            type:
              type: string
