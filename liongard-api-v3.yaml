        objects:
          type: array
          items:
            $ref: '#/components/schemas/webhookObjectSubscription'
    webhookPayload:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - createdAt
      - data
      properties:
        id:
          type: string
          description: Unique webhook event ID
          examples:
          - evt_1234567890
        type:
          type: string
          description: Event type (object.event format)
          examples:
          - alert.created
          enum:
          - alert.created
          - alert.updated
          - alert.deleted
          - asset.created
          - asset.updated
          - asset.deleted
          - dataprint.submitted
          - dataprint.completed
          - dataprint.failed
          - environment.created
          - environment.updated
          - environment.deleted
          - identity.created
          - identity.updated
          - identity.deleted
          - inspector.created
          - inspector.updated
          - inspector.deleted
          - metric.created
          - metric.updated
          - metric.deleted
          - metric.evaluated
          - system.created
          - system.updated
          - system.inspected
        createdAt:
          type: string
          format: date-time
          description: When the event occurred (UTC, ISO 8601)
          examples:
          - '2024-02-06T10:30:00Z'
        data:
          type: object
          required:
          - object
          properties:
            object:
              description: >
                The affected object. Type depends on the event — could be an alert,
                asset, dataprint, environment, identity, inspector, metric, or system.
              oneOf:
              - $ref: '#/components/schemas/alert'
              - $ref: '#/components/schemas/asset'
              - $ref: '#/components/schemas/dataprint'
              - $ref: '#/components/schemas/environment'
              - $ref: '#/components/schemas/identity'
              - $ref: '#/components/schemas/inspector'
              - $ref: '#/components/schemas/metric'
              - $ref: '#/components/schemas/system'
            previousAttributes:
              type: object
              additionalProperties: true
              description: For update events with diff mode, contains only changed
                fields
            snapshot:
              type: object
              description: Complete object snapshot (if includeSnapshot is not 'none')
              oneOf:
              - $ref: '#/components/schemas/alert'
              - $ref: '#/components/schemas/asset'
              - $ref: '#/components/schemas/dataprint'
              - $ref: '#/components/schemas/environment'
              - $ref: '#/components/schemas/identity'
              - $ref: '#/components/schemas/inspector'
              - $ref: '#/components/schemas/metric'
              - $ref: '#/components/schemas/system'
      examples:
      - id: evt_1234567890
        type: alert.created
        createdAt: '2024-02-06T10:30:00Z'
        data:
          object:
            alertId: alert_7586
            environmentId: env_8888
            name: Critical vulnerability detected
            status: open
            priority: critical
            createdAt: '2024-02-06T10:30:00Z'
            updatedAt: '2024-02-06T10:30:00Z'
    webhookSignatureVerification:
      type: object
      description: 'Webhook signatures for verification.


        Each webhook POST includes these headers:

        - X-Liongard-Signature: HMAC-SHA256 signature of the payload

        - X-Liongard-Timestamp: Unix timestamp of when the webhook was sent


        To verify:

        1. Construct the signed payload: `{timestamp}.{raw_json_body}`

        2. Compute HMAC-SHA256 using your webhook secret

        3. Compare to X-Liongard-Signature header


        Reject webhooks with timestamps older than 5 minutes to prevent replay attacks.

        '
    dataprintJobResponse:
      type: object
      required:
      - jobId
      - status
      - message
      - pollUrl
      properties:
        jobId:
          type: string
          description: Unique job identifier for tracking processing status
          examples:
          - job_abc123xyz
        status:
          type: string
          enum:
          - pending
          - processing
          description: Initial job status
          examples:
          - pending
        message:
          type: string
          description: Human-readable status message
          examples:
          - Dataprint accepted for processing
        estimatedCompletionSeconds:
          type: integer
          description: Estimated time to completion in seconds (best effort, not guaranteed)
          examples:
          - 120
        pollUrl:
          type: string
          format: uri
          description: URL to poll for job status updates
          examples:
          - https://api.liongard.example.com/v3/jobs/job_abc123xyz
    objectCapabilitiesResponse:
      type: object
      required:
      - objects
      properties:
        objects:
          type: array
          items:
            type: object
            required:
            - objectType
            - filterableFields
            - expandableFields
            properties:
              objectType:
                type: string
                examples:
                - alert
                - asset
                - dataprint
                - environment
                - identity
                - inspector
                - job
                - metric
                - system
              filterableFields:
                type: array
                items:
                  type: string
                examples:
                - - status
                  - priority
                  - environmentId
                  - inspectorId
                  - createdAt
              expandableFields:
                type: array
                items:
                  type: string
                examples:
                - - environment
                  - inspector
              sortableFields:
                type: array
                items:
                  type: string
                examples:
                - - createdAt
                  - updatedAt
                  - name
                  - status
              events:
                type: array
                items:
                  type: string
                description: Webhook events supported for this object type
                examples:
                - - created
                  - updated
                  - deleted
    assetTypeCapabilitiesResponse:
      type: object
      required:
      - assetTypes
      properties:
        assetTypes:
          type: array
          items:
            type: object
            required:
            - assetType
            - category
            - mappableFields
            properties:
              assetType:
                type: string
                examples:
                - server
                - workstation
                - firewall
              category:
                type: string
                examples:
                - compute
                - network
                - security
              mappableFields:
                type: array
                items:
                  type: string
                examples:
                - - name
                  - ipAddress
                  - serialNumber
    system:
      type: object
      additionalProperties: false
      required:
      - systemId
      - inspectorId
      - environmentId
      - name
      - updatedAt
      properties:
        systemId:
          type: string
          description: Unique system identifier
          examples:
          - system_3454
        inspectorId:
          type: string
          description: Inspector this system runs
          examples:
          - inspector_13
        environmentId:
          type: string
          description: Environment this system belongs to
          examples:
          - env_8888
        name:
          type: string
          description: System display name (typically derived from environment + inspector)
          examples:
          - Acme Corp - Active Directory
          maxLength: 255
        status:
          type: string
          enum:
          - active
          - inactive
          - error
          - pending
          description: Current system status
          examples:
          - active
        lastInspectedAt:
          type: string
          format: date-time
          description: When the last successful inspection completed (UTC, ISO 8601)
          examples:
          - '2024-02-06T08:15:00Z'
        nextInspectionAt:
          type: string
          format: date-time
          description: Scheduled next inspection time (UTC, ISO 8601)
          examples:
          - '2024-02-07T08:15:00Z'
        inspectionFrequency:
          type: object
          description: How often this system is inspected
          properties:
            type:
              type: string
              enum:
              - hours
              - days
              - weeks
              examples:
              - days
            interval:
              type: integer
              examples:
              - 1
        dataprintCount:
          type: integer
          description: Total number of dataprints captured for this system
          examples:
          - 47
        latestDataprintId:
          type: string
          description: ID of the most recent dataprint
          examples:
          - dataprint_xyz789
        inspector:
          description: Expanded inspector object (when expand=inspector)
          $ref: '#/components/schemas/inspector'
        environment:
          description: Expanded environment object (when expand=environment)
          $ref: '#/components/schemas/environment'
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (UTC, ISO 8601)
          examples:
          - '2024-01-15T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp (UTC, ISO 8601)
          examples:
          - '2024-02-06T10:30:00Z'
    systemView:
      type: object
      additionalProperties: false
      required:
      - systemId
      - inspectorId
      - environmentId
      - capturedAt
      - raw
      properties:
        systemId:
          type: string
          description: System this view belongs to
          examples:
          - system_3454
        inspectorId:
          type: string
          examples:
          - inspector_13
        environmentId:
          type: string
          examples:
          - env_8888
        capturedAt:
          type: string
          format: date-time
          description: When this dataprint was captured (UTC, ISO 8601)
          examples:
          - '2024-02-06T08:15:00Z'
        raw:
          type: object
          additionalProperties: true
          description: >
            The complete raw dataprint data captured by the inspector. Structure varies
            by inspector type. This is the data that JMESPath metric queries evaluate against.
        schema:
          type: object
          additionalProperties: true
          description: >
            Inferred schema of the raw data, including field names, types, and nesting
            structure. Useful for building queries or exploring unfamiliar data shapes.
    metricEvaluateResponse:
      type: array
      items:
        type: object
        required:
        - systemId
        - metricId
        - metricName
        - value
        - evaluatedAt
        properties:
          systemId:
            type: string
            description: System (timeline + environment) this metric was evaluated
              for
            examples:
            - system_abc123
          environmentId:
            type: string
            examples:
            - env_8888
          environmentName:
            type: string
            examples:
            - Acme Corp
          metricId:
            type: string
            examples:
            - metric_456
          metricName:
            type: string
            examples:
            - Device Count - Offline
          value:
            description: Metric result value (can be any JSON type)
            examples:
            - 42
            - string value
            - - array
            - object: value
          timelineId:
            type: string
            examples:
            - timeline_xyz
          evaluatedAt:
            type: string
            format: date-time
            examples:
            - '2024-02-06T10:30:00Z'
    systemMetricsResponse:
      type: object
      required:
      - systemId
      - environmentId
      - metrics
      properties:
        systemId:
          type: string
          examples:
          - system_abc123
        environmentId:
          type: string
          examples:
          - env_8888
        environmentName:
          type: string
          examples:
          - Acme Corp
        inspectorId:
          type: string
          examples:
          - inspector_13
        metrics:
          type: array
          items:
            type: object
            required:
            - metricId
            - metricName
            - value
            - evaluatedAt
            properties:
              metricId:
                type: string
              metricName:
                type: string
              value: {}
              evaluatedAt:
                type: string
                format: date-time
    catalogEntry:
      type: object
      additionalProperties: false
      required:
      - inspectorId
      - name
      - category
      - fieldCount
      properties:
        inspectorId:
          type: string
          description: Inspector identifier
          examples:
          - inspector_13
        name:
          type: string
          description: Inspector display name
          examples:
          - Active Directory
        description:
          type: string
          description: What this inspector captures and why it matters
          examples:
          - >
            Inspects Active Directory domains, returning domain configuration,
            group policies, security settings, user accounts, and computer objects.
        category:
          type: string
          description: Inspector category
          examples:
          - identity
        tags:
          type: array
          items:
            type: string
          description: Searchable tags for data discovery
          examples:
          - - active-directory
            - identity
            - security
            - compliance
            - users
            - groups
        fieldCount:
          type: integer
          description: Total number of data fields produced by this inspector
          examples:
          - 142
        topLevelFields:
          type: array
          items:
            type: string
          description: Top-level field names in the dataprint schema
          examples:
          - - DomainControllers
            - Users
            - Computers
            - Groups
            - GroupPolicies
            - SecuritySettings
        sampleMetrics:
          type: array
          description: Example metrics available for this inspector
          items:
            type: object
            properties:
              name:
                type: string
                examples:
                - 'Active Directory: Count of Joined Computers'
              query:
                type: string
                examples:
                - length(Computers)
        systemCount:
          type: integer
          description: Number of active systems using this inspector
          examples:
          - 85
        lastUpdated:
          type: string
          format: date-time
          description: When this catalog entry was last refreshed
    catalogEntryDetail:
      type: object
      additionalProperties: false
      required:
      - inspectorId
      - name
      - schema
      properties:
        inspectorId:
          type: string
          examples:
          - inspector_13
        name:
          type: string
          examples:
          - Active Directory
        description:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        schema:
          type: object
          description: >
            Complete data dictionary describing every field in this inspector's
            dataprint output. Organized hierarchically matching the JSON structure.
          additionalProperties: true
          examples:
          - fields:
            - name: Users
              type: array
              description: All user accounts in the Active Directory domain
              items:
                type: object
                fields:
                - name: DisplayName
                  type: string
                  description: User's display name
                - name: Enabled
                  type: boolean
                  description: Whether the account is enabled
                - name: LastLogonDate
                  type: string
                  description: Last successful login timestamp
                - name: PasswordLastSet
                  type: string
                  description: When the password was last changed
            - name: Computers
              type: array
              description: Computer objects joined to the domain
        versions:
          type: array
          description: Schema version history showing how the data shape has evolved
          items:
            type: object
            properties:
              versionId:
                type: string
              releasedAt:
                type: string
                format: date-time
              fieldsAdded:
                type: array
                items:
                  type: string
              fieldsRemoved:
                type: array
                items:
                  type: string
              fieldsModified:
                type: array
                items:
                  type: string
    queryExamplesResponse:
      type: object
      required:
      - inspectorId
      - examples
      properties:
        inspectorId:
          type: string
          examples:
          - inspector_13
        inspectorName:
          type: string
          examples:
          - Active Directory
        examples:
          type: array
          items:
            type: object
            required:
            - name
            - query
            - description
            properties:
              name:
                type: string
                description: Human-readable name for this query
                examples:
                - Count of Enabled Users
              query:
                type: string
                description: JMESPath expression
                examples:
                - 'length(Users[?Enabled==`true`])'
              description:
                type: string
                description: What this query returns and when to use it
                examples:
                - Returns the total count of enabled (active) user accounts in the domain
              returnType:
                type: string
                enum:
                - number
                - string
                - boolean
                - array
                - object
                description: Expected return type of the query
                examples:
                - number
              tags:
                type: array
                items:
                  type: string
                description: Categorization tags
                examples:
                - - users
                  - security
                  - compliance
    catalogSearchResponse:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            type: object
            required:
            - inspectorId
            - inspectorName
            - matchType
            - matchValue
            properties:
              inspectorId:
                type: string
                description: Inspector containing the match
              inspectorName:
                type: string
                description: Inspector display name
              matchType:
                type: string
                enum:
                - field
                - description
                - tag
                - inspector_name
                - metric_name
                description: What type of match was found
              matchValue:
                type: string
                description: The matched text
              fieldPath:
                type: string
                description: JSONPath to the matched field (for field matches)
                examples:
                - Users[].MFAEnabled
              relevanceScore:
                type: number
                description: Search relevance score (0-1)
                examples:
                - 0.95
    bulkDataprintRequest:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: Dataprint submissions to process (max 50 per request)
          items:
            type: object
            required:
            - environmentId
            - inspectorId
            - data
            properties:
              environmentId:
                type: string
                description: Target environment
                examples:
                - env_8888
              inspectorId:
                type: string
                description: Target inspector
                examples:
                - inspector_13
              data:
                type: object
                additionalProperties: true
                description: Raw data payload (must conform to inspector's config mapping)
        callbackUrl:
          type: string
          format: uri
          description: Optional HTTPS URL to receive notification when all items complete
    bulkDataprintResponse:
      type: object
      required:
      - batchId
      - items
      properties:
        batchId:
          type: string
          description: Unique identifier for this bulk submission
          examples:
          - batch_abc123
        items:
          type: array
          items:
            type: object
            required:
            - environmentId
            - inspectorId
            - status
            properties:
              environmentId:
                type: string
              inspectorId:
                type: string
              status:
                type: string
                enum:
                - accepted
                - rejected
                description: Whether this item was accepted for processing
              jobId:
                type: string
                description: Job ID for tracking (present when status is accepted)
                examples:
                - job_xyz789
              error:
                type: string
                description: Rejection reason (present when status is rejected)
                examples:
                - Concurrent job already processing for this inspector/environment
        summary:
          type: object
          properties:
            total:
              type: integer
              description: Total items submitted
              examples:
              - 10
            accepted:
              type: integer
              description: Items accepted for processing
              examples:
              - 8
            rejected:
              type: integer
              description: Items rejected (conflicts, validation errors)
              examples:
              - 2
    bulkMetricEvaluateRequest:
      type: object
      additionalProperties: false
      required:
      - metrics
      properties:
        metrics:
          type: array
          minItems: 1
          maxItems: 100
          description: Metric IDs to evaluate (max 100)
          items:
            type: string
          examples:
          - - metric_1
            - metric_2
            - metric_3
        filters:
          type: array
          description: Filter which systems to evaluate against
          items:
            type: object
            required:
            - field
            - op
            - value
            properties:
              field:
                type: string
                enum:
                - environmentId
                - environmentName
                - systemId
                - inspectorId
              op:
                type: string
                enum:
                - equal_to
                - contains
                - does_not_contain
                - matches_exactly
                - starts_with
                - ends_with
                - in
              value:
                oneOf:
                - type: string
                - type: integer
                - type: array
                  items:
                    oneOf:
                    - type: string
                    - type: integer
        callbackUrl:
          type: string
          format: uri
          description: HTTPS URL to receive results when evaluation completes
