        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
    notFound:
      description: Not Found - resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
    rateLimited:
      description: Too Many Requests - rate limit exceeded
      headers:
