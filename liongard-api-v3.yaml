          description: Inspector system name (kebab-case identifier)
          examples:
          - active-directory-inspector
          maxLength: 100
        alias:
          type: string
          description: Human-friendly display name
          examples:
          - Active Directory
        description:
          type: string
          description: Inspector description and capabilities
          examples:
          - Inspects Active Directory, returning domain configuration, security policies,
            and user information
        category:
          type: string
          enum:
          - infrastructure
          - security
          - cloud
          - networking
          - appservices
          - database
          - identity
          - backup
          description: Inspector category classification
          examples:
          - identity
        published:
          type: boolean
          description: Whether inspector is published and available
          examples:
          - true
          default: false
        publishedStatus:
          type: string
          enum:
          - production
          - beta
          - alpha
          - deprecated
          description: Publication status
          examples:
          - production
        author:
          type: string
          description: Inspector author/vendor
          examples:
          - Liongard, Inc.
        contactEmail:
          type: string
          format: email
          description: Support contact email
          examples:
          - support@liongard.com
        logo:
          type: string
          format: uri
          description: Logo image URL
          examples:
          - https://resources.static.liongard.com/images/active-directory-inspector.png
        icon:
          type: string
          format: uri
          description: Icon image URL
          examples:
          - https://resources.static.liongard.com/images/icons/microsoft-windows-icon.png
        helpLink:
          type: string
          format: uri
          description: Documentation URL
          examples:
          - https://docs.liongard.com/docs/active-directory-inspection-setup
        status:
          type: string
          enum:
          - active
          - inactive
          - disabled
          - deprecated
          description: Inspector operational status
          examples:
          - active
        lastRunAt:
          type: string
          format: date-time
          description: Last execution timestamp across all environments (UTC, ISO
            8601)
          examples:
          - '2024-02-06T08:15:00Z'
        defaultFrequency:
          type: object
          description: Default run frequency recommendation
          properties:
            type:
              type: string
              enum:
              - hours
              - days
              - weeks
              examples:
              - days
            interval:
              type: integer
              examples:
              - 1
        constraints:
          type: object
          description: Inspector execution constraints and requirements
          properties:
            tiers:
              type: array
              items:
                type: string
                enum:
                - production
                - staging
                - development
                - test
              description: Allowed environment tiers
              examples:
              - - production
            platform:
              type: array
              items:
                type: string
                enum:
                - windows
                - linux
                - macos
                - cloud
              description: Required agent platforms
              examples:
              - - windows
            frequency:
              type: object
              properties:
                maxIntervalType:
                  type: string
                  enum:
                  - hours
                  - days
                  examples:
                  - hours
                maxIntervalFrequency:
                  type: integer
                  examples:
                  - 8
        enhancedBilling:
          type: boolean
          description: Whether inspector has enhanced billing requirements
          examples:
          - false
        diagnosticsEnabled:
          type: boolean
          description: Whether diagnostics/debug logging is enabled
          examples:
          - false
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (UTC, ISO 8601)
          examples:
          - '2021-09-10T19:21:03Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp (UTC, ISO 8601)
          examples:
          - '2024-02-06T10:30:00Z'
        version:
          type: integer
          description: Optimistic locking version number
          examples:
          - 12
