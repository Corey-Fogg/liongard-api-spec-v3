    unprocessableEntity:
      description: Unprocessable Entity - request valid but cannot be processed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorResponse'
  schemas:
    alert:
      type: object
      additionalProperties: false
      required:
      - alertId
      - environmentId
      - name
      - status
      - updatedAt
      properties:
        alertId:
          type: string
          description: Unique alert identifier
          examples:
          - alert_7586
        environmentId:
          type: string
          description: Environment this alert belongs to
          examples:
          - env_8888
        commonId:
          type: string
          description: Common identifier for grouping related alerts (e.g., ticket
            system ID)
          examples:
          - T20210920.00001
        category:
          type: string
          description: Alert category or classification (e.g., security, compliance,
            performance)
          examples:
          - security
        name:
          type: string
          description: Alert title or summary
          examples:
          - Critical vulnerability detected
          maxLength: 255
        description:
          type: string
          description: Detailed alert description
          examples:
          - Multiple systems missing critical security patches
        priority:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
          description: Alert priority level
          examples:
          - critical
        source:
          type: string
          description: Source system or integration that created the alert
          examples:
          - liongard-inspector
          maxLength: 100
        owner:
          type: string
          description: User ID or email of the person/team responsible for the alert
          examples:
          - user@example.com
        percentComplete:
          type: integer
          minimum: 0
          maximum: 100
          description: Progress percentage (0-100)
          examples:
          - 45
          default: 0
        autoClose:
          type: integer
          minimum: 0
          description: Days until auto-close (0 = disabled)
          examples:
          - 30
          default: 0
        status:
          type: string
          enum:
          - open
          - in_progress
          - resolved
          - closed
          description: Current alert status
          examples:
          - open
        roarStatus:
          type: integer
          description: Internal ROAR system status code
          examples:
          - 0
        keywords:
          type: string
          description: Comma-separated keywords for search/filtering
          examples:
          - security,patch,vulnerability
          maxLength: 500
        startDate:
          type: string
          format: date-time
          description: Alert start timestamp (UTC, ISO 8601)
          examples:
          - '2024-01-15T10:30:00Z'
        dueDate:
          type: string
          format: date-time
          description: Alert due date (UTC, ISO 8601)
          examples:
          - '2024-02-15T10:30:00Z'
        externalId:
          type: integer
          description: External system identifier (e.g., PSA ticket number)
          examples:
          - 12345
        inspectorId:
          type: string
          description: Inspector that generated this alert (if applicable)
          examples:
          - inspector_13
        timelineId:
          type: string
          description: Timeline/dataprint ID that triggered this alert
          examples:
          - timeline_1294715
        launchpointId:
          type: string
          description: Launchpoint (inspection configuration) that generated this
            alert
          examples:
          - launchpoint_18700
        visible:
          type: boolean
          description: Whether alert is visible in UI
          examples:
          - true
          default: true
        createdBy:
          type: string
          description: User ID or email who created the alert
          examples:
          - system@liongard.com
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (UTC, ISO 8601)
          examples:
          - '2024-01-15T10:30:00Z'
        updatedBy:
          type: string
          description: User ID or email who last updated the alert
          examples:
          - user@example.com
        updatedAt:
