  /v3/inspectors/{inspectorId}/manifest:
    get:
      tags:
      - Inspector Builder
      summary: Export an inspector as a single manifest document
      description: 'Returns a single JSON document with every sub-resource of
        the inspector — definition, authentication, ui-config-template,
        endpoints, discovery, dataprintMetadata, views, asset-mappings,
        metrics, and rules. The output is round-trippable: it can be POSTed to
        `/v3/inspectors/import` (with `upsert=true`) to reconstruct the
        inspector exactly. Secure ui-config field values are never included.

        '
      operationId: exportInspectorManifest
      parameters:
      - $ref: '#/components/parameters/inspectorId'
      - name: environmentId
        in: query
        required: false
        schema:
          type: string
        description: 'When supplied, the environment-scoped dataprint config is
          included in the manifest under `dataprintMetadata`.

          '
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inspectorManifest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '429':
          $ref: '#/components/responses/rateLimited'
    put:
      tags:
      - Inspector Builder
      summary: Replace an inspector entirely from a manifest
      description: 'Atomic replacement of an existing inspector''s sub-resources
        from a manifest. Equivalent to POST `/v3/inspectors/import` with
        `upsert=true` and a matching `definition.name`, but bound to the
        inspectorId in the path.

        '
      operationId: replaceInspectorFromManifest
      parameters:
      - $ref: '#/components/parameters/inspectorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/inspectorManifestImportRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inspectorManifestImportResponse'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/unprocessableEntity'
        '429':
          $ref: '#/components/responses/rateLimited'
  /v3/inspectors/import:
    post:
      tags:
      - Inspector Builder
      summary: Provision a complete inspector from a manifest
      description: 'Reads a single JSON manifest and issues the systematic
        sequence of API calls required to provision the inspector and all of
        its sub-resources. The response includes the full `callPipeline` —
        every operationId, method, path, and payload that was executed (or
        would have been executed in `dryRun` mode).


        **Pipeline order (sections present in the manifest run; sections absent
        are skipped):**


        1. `POST /v3/inspectors` (or `PATCH /v3/inspectors/{id}` when `upsert`
        matches an existing name)

        2. `PUT /v3/inspectors/{id}/ui-config-template`

        3. `PUT /v3/inspectors/{id}/authentication`

        4. `POST /v3/inspectors/{id}/endpoints` per endpoint

        5. `PUT /v3/inspectors/{id}/discovery`

        6. `PUT /v3/environments/{environmentId}/inspectors/{id}/config`
        (when `dataprintMetadata` + `environmentId` are present)

        7. `POST /v3/inspectors/{id}/views` per view

        8. `PUT /v3/inspectors/{id}/asset-mappings`

        9. `POST /v3/metrics` per metric

        10. `POST /v3/inspectors/{id}/rules` per rule


        Use `dryRun=true` to preview the pipeline without mutating state.

        '
      operationId: importInspectorManifest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/inspectorManifestImportRequest'
      responses:
        '201':
          description: Created - manifest applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inspectorManifestImportResponse'
        '200':
          description: OK - dryRun preview or partial import (when `stopOnError`
            is false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inspectorManifestImportResponse'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '409':
          description: Conflict - an inspector with the same name already exists
            and `upsert=false`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
        '422':
          $ref: '#/components/responses/unprocessableEntity'
        '429':
          $ref: '#/components/responses/rateLimited'
