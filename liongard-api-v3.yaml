        '404':
          $ref: '#/components/responses/notFound'
        '429':
          $ref: '#/components/responses/rateLimited'
    put:
      tags:
      - Inspectors
      summary: Set dataprint config for an inspector
      description: 'Configure the metadata mapping for this inspector. This defines
        how the service

        will parse data submitted via POST /dataprints.


        The configVersion is auto-incremented on each update.

        '
      operationId: upsertDataprintConfig
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/inspectorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dataprintConfigUpsertRequest'
            examples:
              tiered:
                summary: Tiered configuration
                value:
                  metadata:
                    dataStructure: tiered
                    environments:
                      arrayPath: $.clients[*]
                      namePath: $.name
                      idPath: $.id
                    assets:
                      arrayPath: $.devices[*]
                      namePath: $.hostname
                      typePath: $.type
                      uniqueIdPath: $.serial_number
                    views:
                    - type: server
                      fields:
                      - hostname
                      - type
                      - ip_address
                      - os
              split:
                summary: Split configuration
                value:
                  metadata:
                    dataStructure: split
                    environments:
                      arrayPath: $.clients[*]
                      namePath: $.name
                      idPath: $.id
                    assets:
                      arrayPath: $.devices[*]
                      namePath: $.hostname
                      typePath: $.type
                      uniqueIdPath: $.serial_number
                      environmentIdPath: $.client_id
                    views:
                    - type: workstation
                      fields:
                      - hostname
                      - ip_address
                      - os
                      - primary_user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dataprintConfig'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
