      required: true
      schema:
        type: string
      description: Unique dataprint identifier
    environmentId:
      name: environmentId
      in: path
      required: true
      schema:
        type: string
      description: Unique environment identifier
    expand:
      name: expand
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      description: 'Dynamic expansions for nested fields. No expand-all wildcard supported.

        Use /v3/meta endpoints to discover supported expansion values for each resource
        type.


        Example: expand=environment&expand=inspector

        '
    filter:
      name: filter
      in: query
      required: false
      schema:
        type: string
      description: 'Filter results using RSQL (RESTful Service Query Language) syntax.


        **Operators:**

        - `==` - Equal

        - `!=` - Not equal

        - `>` - Greater than

        - `>=` - Greater than or equal

        - `<` - Less than

        - `<=` - Less than or equal

        - `=in=` - In list (e.g., `status=in=(pending,processing)`)

        - `=out=` - Not in list

        - Wildcards: `*` for pattern matching (e.g., `name==*server*`)


        **Combinators:**

        - `;` - AND

        - `,` - OR

        - `()` - Grouping


        **Examples:**

        - `status==active`

        - `priority==critical;status==open`

        - `status=in=(pending,processing)`

        - `createdAt>=2024-01-01;createdAt<2024-02-01`

        - `name==*server*,name==*router*`

        - `environmentId==env_8888;(status==open,status==in_progress)`


        Consult /v3/meta/objects to discover filterable fields per resource type.

        '
    identityId:
      name: identityId
      in: path
      required: true
      schema:
        type: string
      description: Unique identity identifier
    inspectorId:
      name: inspectorId
      in: path
      required: true
      schema:
        type: string
      description: 'Unique inspector identifier. This ID is global and consistent
        across environments.

        '
    endpointDefId:
      name: endpointDefId
      in: path
      required: true
      schema:
        type: string
      description: 'Unique identifier for a single HTTP endpoint definition attached
        to an inspector. Assigned on POST and stable thereafter.

        '
    viewId:
      name: viewId
      in: path
      required: true
      schema:
        type: string
      description: 'Unique identifier for a single UI view (tab) attached to an inspector.

        '
    ruleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
      description: 'Unique identifier for a single alert rule attached to an inspector.

        '
    jobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
      description: Unique job identifier
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      description: Maximum number of results to return (1-1000)
    metricId:
      name: metricId
      in: path
      required: true
      schema:
        type: string
      description: Unique metric identifier
    offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of results to skip for pagination
    sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: 'Field name to sort by. Prefix with ''-'' for descending order.


        Examples:

        - sort=createdAt (ascending)

        - sort=-updatedAt (descending)

        '
    strictExpand:
      name: strictExpand
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: 'If true, unsupported expand values return HTTP 422.

        If false, unsupported expand values are ignored with warnings in response.

        '
    subscriptionId:
