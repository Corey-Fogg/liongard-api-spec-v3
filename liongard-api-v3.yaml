openapi: 3.1.0
info:
  title: Liongard Data API
  version: 3.0.0
  description: >
    Liongard Data API v3 — the structured datalake API for IT infrastructure intelligence.


    Liongard captures, normalizes, and structures operational data from across your IT
    environment. This API enables vendors and integrations to **push data in** (via dataprints),
    **pull insights out** (via metrics and queries), and **react to changes** (via webhooks).
    Every piece of data is tagged with rich metadata — environment context, inspector lineage,
    asset classification, and schema mappings — so it can be discovered, queried, and consumed
    by both humans and AI systems.


    The API uses camelCase field naming, RSQL filtering, header-based pagination (RFC 5988),
    dynamic field expansion, and async processing with job tracking.


    **Authentication**: All endpoints use API Key authentication via the `X-API-Key` header.


    **Core Resources**:

    - **Environments**: Organizational units (clients, tenants, sites) that scope all data

    - **Inspectors**: Data collection definitions — what data to capture and how to map it

    - **Systems**: Inspector + Environment instances — the runtime context where data is captured

    - **Dataprints**: Point-in-time data snapshots pushed by inspectors (the raw datalake content)

    - **Assets**: Inventory items extracted and classified from dataprint data (read-only)

    - **Identities**: User/identity records extracted from dataprint data (read-only)

    - **Metrics**: JMESPath queries that extract structured insights from raw dataprints

    - **Alerts**: Trackable issues and tasks (create, update, close — not delete)

    - **Jobs**: Async operation trackers for long-running processes

    - **Webhooks**: Event subscriptions for real-time change notifications

    - **Data Catalog**: Schema discovery and metadata for AI-accessible data exploration
servers:
- url: https://api.liongard.example.com
security:
- apiKeyAuth: []
tags:
- name: Alerts
  description: >
    Trackable issues and tasks tied to environments. Alerts can be created, updated,
    and closed (but never deleted) — making them ideal for compliance and audit trails.
- name: Assets
  description: >
    IT asset inventory — servers, workstations, network devices, and more. Assets are
    read-only via the API; they are automatically populated when inspectors map incoming
    dataprint data to the asset inventory.
- name: Data Catalog
  description: >
    Schema discovery and data dictionary for the Liongard datalake. Use these endpoints
    to explore what data is available, understand field meanings, and discover relationships
    between datasets — designed for both human and AI consumption.
- name: Environments
  description: >
    Organizational units that scope all data — typically representing clients, tenants,
    or sites. Environments support hierarchical structures via parentEnvironmentId.
- name: Identities
  description: >
    User and identity records discovered across inspected systems (Active Directory users,
    M365 accounts, etc.). Read-only — populated automatically via inspector data mappings.
- name: Inspectors
  description: >
    Data collection definitions that describe what data to capture and how to map it.
    Inspectors are global entities; they are scoped to environments for runtime operations
    like pushing dataprints and configuring data mappings.
- name: Jobs
  description: >
    Async operation tracking for long-running processes like dataprint ingestion.
    Poll job status, track progress, or cancel pending operations.
- name: Meta
  description: >
    API capability and schema discovery. Query filterable fields, expandable fields,
    supported events, and asset type metadata to build dynamic integrations.
- name: Metrics
  description: >
    JMESPath-based queries that extract structured data points from raw dataprints.
    Create custom metrics, evaluate them across systems, and enable change detection
    for alerting workflows.
- name: Systems
  description: >
    Runtime instances where an inspector operates within an environment. A system
    represents the combination of an inspector and environment — the context in which
    dataprints are captured and metrics are evaluated.
- name: Webhooks
  description: >
    Event subscriptions for real-time notifications. Subscribe to changes on any
    resource type with RSQL filtering, field expansion, and delivery mode control.
paths:
  /v3/alerts:
    get:
      tags:
      - Alerts
      summary: List alerts
      operationId: listAlerts
      parameters:
      - $ref: '#/components/parameters/expand'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/strictExpand'
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/alert'
          headers:
            X-Pagination-Limit: &id001
              description: Maximum number of items per page
              schema:
                type: integer
              example: 100
            X-Pagination-Offset: &id002
              description: Number of items skipped
              schema:
                type: integer
              example: 0
            X-Pagination-Count: &id003
              description: Total number of items available
              schema:
                type: integer
              example: 547
            X-Pagination-Has-More: &id004
              description: Whether more items are available
              schema:
                type: boolean
              example: true
            Link: &id005
              description: Pagination links (RFC 5988)
              schema:
                type: string
              example: <https://api.liongard.com/v3/alerts?limit=100&offset=100>;
                rel="next", <https://api.liongard.com/v3/alerts?limit=100&offset=0>;
                rel="first"
        '401':
          $ref: '#/components/responses/unauthorized'
        '422':
          $ref: '#/components/responses/unprocessableEntity'
        '429':
          $ref: '#/components/responses/rateLimited'
    post:
      tags:
      - Alerts
      summary: Create an alert
      operationId: createAlert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/alertCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/alert'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '429':
          $ref: '#/components/responses/rateLimited'
  /v3/alerts/{alertId}:
    get:
      tags:
      - Alerts
      summary: Get an alert
      operationId: getAlert
      parameters:
      - $ref: '#/components/parameters/alertId'
      - $ref: '#/components/parameters/expand'
      - $ref: '#/components/parameters/strictExpand'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/alert'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/unprocessableEntity'
        '429':
          $ref: '#/components/responses/rateLimited'
    patch:
      tags:
      - Alerts
      summary: Update an alert (including close operation)
      operationId: updateAlert
      description: 'Update alert fields. To close an alert, set status to appropriate
        closed state.

        Alerts cannot be deleted, only closed.

        '
      parameters:
      - $ref: '#/components/parameters/alertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/alertPatchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/alert'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/unprocessableEntity'
        '429':
          $ref: '#/components/responses/rateLimited'
  /v3/assets:
    get:
      tags:
      - Assets
      summary: List assets
      description: Assets are read-only and created via inspector data mappings to
        the Asset Inventory.
      operationId: listAssets
      parameters:
      - $ref: '#/components/parameters/expand'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/strictExpand'
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/asset'
          headers:
            X-Pagination-Limit: *id001
            X-Pagination-Offset: *id002
            X-Pagination-Count: *id003
            X-Pagination-Has-More: *id004
            Link: *id005
        '401':
          $ref: '#/components/responses/unauthorized'
        '422':
          $ref: '#/components/responses/unprocessableEntity'
        '429':
          $ref: '#/components/responses/rateLimited'
  /v3/assets/{assetId}:
    get:
      tags:
      - Assets
      summary: Get an asset
      operationId: getAsset
      parameters:
      - $ref: '#/components/parameters/assetId'
      - $ref: '#/components/parameters/expand'
      - $ref: '#/components/parameters/strictExpand'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/asset'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/unprocessableEntity'
        '429':
          $ref: '#/components/responses/rateLimited'
  /v3/environments:
    get:
      tags:
      - Environments
      summary: List environments
      operationId: listEnvironments
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/environment'
          headers:
            X-Pagination-Limit: *id001
            X-Pagination-Offset: *id002
            X-Pagination-Count: *id003
            X-Pagination-Has-More: *id004
            Link: *id005
        '401':
          $ref: '#/components/responses/unauthorized'
        '429':
          $ref: '#/components/responses/rateLimited'
    post:
      tags:
      - Environments
      summary: Create an environment
      operationId: createEnvironment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/environmentCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/environment'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '429':
          $ref: '#/components/responses/rateLimited'
  /v3/environments/{environmentId}:
    get:
      tags:
      - Environments
      summary: Get an environment
      operationId: getEnvironment
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/environment'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '429':
          $ref: '#/components/responses/rateLimited'
    patch:
      tags:
      - Environments
      summary: Update an environment
      operationId: updateEnvironment
      parameters:
      - $ref: '#/components/parameters/environmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/environmentPatchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/environment'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '429':
          $ref: '#/components/responses/rateLimited'
    delete:
      tags:
      - Environments
      summary: Delete an environment
      operationId: deleteEnvironment
      parameters:
      - $ref: '#/components/parameters/environmentId'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '429':
          $ref: '#/components/responses/rateLimited'
  /v3/identities:
    get:
      tags:
      - Identities
      summary: List identities
      description: Identities are read-only and created via inspector data mappings.
      operationId: listIdentities
      parameters:
      - $ref: '#/components/parameters/expand'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/strictExpand'
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/identity'
          headers:
            X-Pagination-Limit: *id001
            X-Pagination-Offset: *id002
            X-Pagination-Count: *id003
            X-Pagination-Has-More: *id004
            Link: *id005
        '401':
          $ref: '#/components/responses/unauthorized'
        '422':
          $ref: '#/components/responses/unprocessableEntity'
        '429':
          $ref: '#/components/responses/rateLimited'
  /v3/identities/{identityId}:
    get:
      tags:
      - Identities
      summary: Get an identity
      operationId: getIdentity
      parameters:
      - $ref: '#/components/parameters/identityId'
      - $ref: '#/components/parameters/expand'
      - $ref: '#/components/parameters/strictExpand'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/identity'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/unprocessableEntity'
        '429':
          $ref: '#/components/responses/rateLimited'
  /v3/inspectors:
    get:
      tags:
      - Inspectors
      summary: List all inspectors (global)
      operationId: listInspectors
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/inspector'
          headers:
            X-Pagination-Limit: *id001
            X-Pagination-Offset: *id002
            X-Pagination-Count: *id003
            X-Pagination-Has-More: *id004
            Link: *id005
        '401':
          $ref: '#/components/responses/unauthorized'
        '429':
          $ref: '#/components/responses/rateLimited'
    post:
      tags:
      - Inspectors
      summary: Create a global inspector
      description: 'Creates a global inspector. The inspector can then be accessed
        under specific environments

        using /v3/environments/{environmentId}/inspectors/{inspectorId} for environment-scoped
        operations.

        '
      operationId: createInspector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/inspectorCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inspector'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '429':
          $ref: '#/components/responses/rateLimited'
  /v3/inspectors/{inspectorId}:
    get:
      tags:
      - Inspectors
      summary: Get a global inspector
      operationId: getInspector
      parameters:
      - $ref: '#/components/parameters/inspectorId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inspector'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '429':
          $ref: '#/components/responses/rateLimited'
    patch:
      tags:
      - Inspectors
      summary: Update a global inspector
      operationId: updateInspector
      parameters:
      - $ref: '#/components/parameters/inspectorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/inspectorPatchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inspector'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '429':
          $ref: '#/components/responses/rateLimited'
    delete:
      tags:
      - Inspectors
      summary: Delete a global inspector
      operationId: deleteInspector
      parameters:
      - $ref: '#/components/parameters/inspectorId'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '429':
          $ref: '#/components/responses/rateLimited'
  /v3/environments/{environmentId}/inspectors:
    get:
      tags:
      - Inspectors
      summary: List inspectors for an environment
      description: 'Returns the same global inspectors, but scoped to this environment.

        The inspectorId values match those from /v3/inspectors.

        '
      operationId: listInspectorsByEnvironment
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/inspector'
          headers:
            X-Pagination-Limit: *id001
            X-Pagination-Offset: *id002
            X-Pagination-Count: *id003
            X-Pagination-Has-More: *id004
            Link: *id005
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '429':
          $ref: '#/components/responses/rateLimited'
  /v3/environments/{environmentId}/inspectors/{inspectorId}:
    get:
      tags:
      - Inspectors
      summary: Get an inspector in environment context
      description: 'Get the same global inspector, but in the context of this environment.

        This inspectorId matches the global inspector from /v3/inspectors/{inspectorId}.

        '
      operationId: getInspectorInEnvironment
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/inspectorId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inspector'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '429':
          $ref: '#/components/responses/rateLimited'
  /v3/environments/{environmentId}/inspectors/{inspectorId}/dataprints:
    get:
      tags:
      - Inspectors
      summary: List dataprints for an inspector in an environment
      operationId: listDataprints
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/inspectorId'
      - $ref: '#/components/parameters/expand'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/strictExpand'
      - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/dataprint'
          headers:
            X-Pagination-Limit: *id001
            X-Pagination-Offset: *id002
            X-Pagination-Count: *id003
            X-Pagination-Has-More: *id004
            Link: *id005
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          $ref: '#/components/responses/unprocessableEntity'
        '429':
          $ref: '#/components/responses/rateLimited'
    post:
      tags:
      - Inspectors
      summary: Push data (create a dataprint)
      description: "Push data for this inspector in this environment. The data structure\
        \ must conform \nto the metadata mapping configured via the /config endpoint.\n\
        \n**Asynchronous Processing**: Dataprint processing happens asynchronously.\
        \ This endpoint \nreturns immediately with a job ID. You can:\n- Poll the\
        \ job status using GET /v3/jobs/{jobId}\n- Provide a callbackUrl for one-time\
        \ notification on completion\n- Subscribe to webhooks for all dataprint events\n\
        \nThis endpoint uses the configVersion from the inspector's current config.\n\
        The request body only contains the data payload.\n"
      operationId: createDataprint
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/inspectorId'
      - name: callbackUrl
        in: query
        required: false
        schema:
          type: string
          format: uri
        description: 'Optional HTTPS URL to receive a one-time POST notification when
          processing completes.

          The callback will receive the same payload structure as the job status endpoint.

          '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/dataprintCreateRequest'
            examples:
              tiered:
                summary: Tiered data structure
                value:
                  clients:
                  - id: client_002
                    name: Acme Manufacturing
                    devices:
                    - hostname: acme-dc01
                      type: server
                      serial_number: SRV-ACME-0001
                      ip_address: 10.10.0.10
                      os: Windows Server 2022 Datacenter
              split:
                summary: Split data structure
                value:
                  clients:
                  - id: client_002
                    name: Acme Manufacturing
                  devices:
                  - client_id: client_002
                    hostname: acme-cad-ws07
                    type: workstation
                    serial_number: WS-ACME-1007
                    ip_address: 10.10.10.57
                    os: Windows 11 Pro 24H2
                    primary_user: lchen@acmemfg.com
      responses:
        '202':
          description: Accepted - Processing asynchronously
          headers:
            Location:
              description: URL to poll for job status
              schema:
                type: string
                format: uri
              example: https://api.liongard.example.com/v3/jobs/job_abc123xyz
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dataprintJobResponse'
        '400':
          description: Validation failed - data does not match config schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorResponse'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          description: Conflict - A job is already processing for this inspector in
            this environment
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                properties:
                  error:
                    type: object
                    required:
                    - code
                    - message
                    properties:
                      code:
                        type: string
                        examples:
                        - CONCURRENT_JOB_CONFLICT
                      message:
                        type: string
                        examples:
                        - A dataprint job is already processing for inspector 'inspector_13'
                          in environment 'env_8888'
                      details:
                        type: object
                        properties:
                          existingJobId:
                            type: string
                            description: ID of the currently running job
                            examples:
                            - job_existing123
                          existingJobStatus:
                            type: string
                            examples:
                            - processing
                          existingJobCreatedAt:
                            type: string
                            format: date-time
                            examples:
                            - '2024-02-06T10:28:00Z'
                          suggestion:
                            type: string
                            examples:
                            - Wait for the existing job to complete or cancel it using
                              DELETE /v3/jobs/job_existing123
        '429':
          $ref: '#/components/responses/rateLimited'
  /v3/environments/{environmentId}/inspectors/{inspectorId}/dataprints/{dataprintId}:
    get:
      tags:
      - Inspectors
      summary: Get a specific dataprint
      operationId: getDataprint
      parameters:
      - $ref: '#/components/parameters/environmentId'
      - $ref: '#/components/parameters/inspectorId'
      - $ref: '#/components/parameters/dataprintId'
