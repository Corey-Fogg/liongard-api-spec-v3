    job:
      type: object
      additionalProperties: false
      required:
      - jobId
      - type
      - status
      - createdAt
      - updatedAt
      properties:
        jobId:
          type: string
          description: Unique job identifier
          examples:
          - job_abc123xyz
        type:
          type: string
          enum:
          - dataprint_processing
          - metric_evaluation
          - bulk_operation
          description: Type of job
          examples:
          - dataprint_processing
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
          - cancelled
          description: Current job status
          examples:
          - completed
        progress:
          type: object
          description: Job progress information
          properties:
            current:
              type: integer
              minimum: 0
              description: Current progress step
              examples:
              - 2
            total:
              type: integer
              minimum: 0
              description: Total steps
              examples:
              - 3
            percentage:
              type: integer
              minimum: 0
              maximum: 100
              description: Progress percentage
              examples:
              - 66
            message:
              type: string
              description: Human-readable progress message
              examples:
              - Processing environments (2/3)
        resourceType:
          type: string
          description: Type of resource this job is processing
          examples:
          - dataprint
        resourceId:
          type: string
          description: ID of the resource being processed
          examples:
          - dataprint_xyz789
        environmentId:
          type: string
          description: Environment context
          examples:
          - env_8888
        inspectorId:
          type: string
          description: Inspector context (for dataprint jobs)
          examples:
          - inspector_13
        callbackUrl:
          type: string
          format: uri
          description: Optional callback URL for completion notification
          examples:
          - https://partner.example.com/webhooks/dataprint-complete
        callbackAttempts:
          type: integer
          description: Number of callback delivery attempts made
          examples:
          - 1
        callbackLastAttempt:
          type: string
          format: date-time
          description: Last callback attempt timestamp
          examples:
          - '2024-02-06T10:30:15Z'
        result:
          type: object
          description: Job result (populated when status is completed or failed)
          additionalProperties: true
          examples:
          - accepted: true
            environmentsProcessed: 1
            assetsProcessed: 5
            warnings: []
            errors: []
        error:
          type: object
          description: Error details (populated when status is failed)
          properties:
            code:
              type: string
              examples:
              - VALIDATION_ERROR
            message:
              type: string
              examples:
              - Invalid JSONPath in assets.uniqueIdPath
            details:
              type: object
              additionalProperties: true
        createdAt:
          type: string
          format: date-time
          description: Job creation timestamp (UTC, ISO 8601)
          examples:
          - '2024-02-06T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp (UTC, ISO 8601)
          examples:
          - '2024-02-06T10:30:15Z'
        startedAt:
          type: string
          format: date-time
          description: Processing start timestamp
          examples:
          - '2024-02-06T10:30:01Z'
        completedAt:
          type: string
          format: date-time
          description: Completion timestamp
          examples:
          - '2024-02-06T10:30:15Z'
        estimatedCompletionAt:
          type: string
          format: date-time
          description: Estimated completion time
          examples:
          - '2024-02-06T10:32:00Z'
    metric:
      type: object
      additionalProperties: false
      required:
      - metricId
      - name
      - inspectorId
      - updatedAt
      properties:
        metricId:
          type: string
          description: Unique metric identifier
          examples:
          - metric_1
        uuid:
          type: string
          format: uuid
          description: UUID for external reference
          examples:
          - aa4eef4d-3dc5-4b3d-9d8a-00c1d9b68065
        name:
          type: string
          description: Metric name
          examples:
          - 'Active Directory: Count of Joined Computers'
          maxLength: 255
        description:
          type: string
          description: Detailed metric description
          examples:
          - Number of computers joined to this Active Directory domain (servers and
            workstations)
        inspectorId:
          type: string
          description: Inspector this metric applies to
          examples:
          - inspector_13
        environmentId:
          type: string
          description: Environment scope (null for global metrics)
          examples:
          - env_8888
        queries:
          type: array
          description: JMESPath queries for different inspector versions
          items:
            type: object
            required:
            - query
            - inspectorVersionId
            properties:
              query:
                type: string
                description: JMESPath expression to evaluate
                examples:
                - length(Computers)
              inspectorVersionId:
                type: string
                description: Inspector version this query applies to
                examples:
                - version_26
        metricDisplay:
          type: boolean
          description: Whether metric is displayed in UI by default
          examples:
          - true
          default: true
        changesEnabled:
          type: boolean
          description: Whether change detection is enabled for this metric
          examples:
          - true
          default: false
        isCustom:
          type: boolean
          description: Custom metric (true) vs system-provided (false)
          examples:
          - false
        hasActiveAlertRule:
          type: boolean
          description: Whether this metric has active alert rules
          examples:
          - true
        belongsToChangeRule:
          type: boolean
          description: Whether this metric belongs to a change detection rule
          examples:
          - false
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (UTC, ISO 8601)
          examples:
          - '2021-09-10T19:21:03Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp (UTC, ISO 8601)
          examples:
          - '2024-02-06T10:30:00Z'
    metricCreateRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - inspectorId
      - queries
      properties:
        name:
          type: string
          maxLength: 255
          examples:
          - 'Active Directory: Count of Joined Computers'
        description:
          type: string
          examples:
          - Number of computers joined to this Active Directory domain
        inspectorId:
          type: string
          examples:
          - inspector_13
        environmentId:
          type: string
          description: Scope to specific environment (omit for global)
          examples:
          - env_8888
        queries:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - query
            - inspectorVersionId
            properties:
              query:
                type: string
                examples:
                - length(Computers)
              inspectorVersionId:
                type: string
                examples:
                - version_26
        metricDisplay:
          type: boolean
          default: true
        changesEnabled:
          type: boolean
          default: false
    metricPatchRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
        queries:
          type: array
          items:
            type: object
            required:
            - query
            - inspectorVersionId
            properties:
              query:
                type: string
              inspectorVersionId:
                type: string
        metricDisplay:
          type: boolean
        changesEnabled:
          type: boolean
    metricEvaluateRequest:
      type: object
      additionalProperties: false
      required:
      - metrics
      - pagination
      properties:
        metrics:
          type: array
          description: Metric IDs or UUIDs to evaluate
          minItems: 1
          items:
            type: string
          examples:
          - - metric_1
            - aa4eef4d-3dc5-4b3d-9d8a-00c1d9b68065
        filters:
          type: array
          description: Filter results by environment, system, etc.
          items:
            type: object
            required:
            - field
            - op
            - value
            properties:
              field:
                type: string
                enum:
                - environmentId
                - environmentName
                - systemId
                - systemName
                - inspectorId
                examples:
                - environmentId
              op:
                type: string
                enum:
                - equal_to
                - contains
                - does_not_contain
                - matches_exactly
                - starts_with
                - ends_with
                examples:
                - equal_to
              value:
                oneOf:
                - type: string
                - type: integer
                - type: array
                  items:
                    oneOf:
                    - type: string
                    - type: integer
                examples:
                - env_8888
        sorting:
          type: array
          items:
            type: object
            required:
            - field
            - direction
            properties:
              field:
                type: string
                enum:
                - metricName
                - environmentName
                - systemName
                - metricId
                - environmentId
                - systemId
                examples:
                - environmentName
              direction:
                type: string
                enum:
                - asc
                - desc
                examples:
                - asc
        pagination:
          type: object
          required:
          - limit
          - offset
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 1000
              examples:
              - 25
            offset:
              type: integer
              minimum: 0
              examples:
              - 0
        date:
          type: string
          format: date-time
          description: Evaluation date (defaults to latest dataprint if omitted)
          examples:
          - '2024-02-06T00:00:00Z'
    objectCapabilities:
