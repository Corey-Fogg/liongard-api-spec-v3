    inspectorPatchRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        alias:
          type: string
        description:
          type: string
        category:
          type: string
          enum:
          - infrastructure
          - security
          - cloud
          - networking
          - appservices
          - database
          - identity
          - backup
        author:
          type: string
        contactEmail:
          type: string
          format: email
        helpLink:
          type: string
          format: uri
        logo:
          type: string
          format: uri
        icon:
          type: string
          format: uri
        defaultFrequency:
          type: object
          properties:
            type:
              type: string
              enum:
              - hours
              - days
              - weeks
            interval:
              type: integer
              minimum: 1
        status:
          type: string
          enum:
          - active
          - inactive
          - disabled
          - deprecated
    job:
      type: object
      additionalProperties: false
      required:
      - jobId
      - type
      - status
      - createdAt
      - updatedAt
      properties:
        jobId:
          type: string
          description: Unique job identifier
          examples:
          - job_abc123xyz
        type:
          type: string
          enum:
          - dataprint_processing
          - metric_evaluation
          - bulk_operation
          description: Type of job
          examples:
          - dataprint_processing
        status:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
          - cancelled
          description: Current job status
          examples:
          - completed
        progress:
          type: object
          description: Job progress information
          properties:
            current:
              type: integer
              minimum: 0
              description: Current progress step
              examples:
              - 2
            total:
              type: integer
              minimum: 0
              description: Total steps
              examples:
              - 3
            percentage:
              type: integer
              minimum: 0
              maximum: 100
              description: Progress percentage
              examples:
              - 66
            message:
              type: string
              description: Human-readable progress message
              examples:
              - Processing environments (2/3)
        resourceType:
          type: string
          description: Type of resource this job is processing
          examples:
          - dataprint
        resourceId:
          type: string
          description: ID of the resource being processed
          examples:
          - dataprint_xyz789
        environmentId:
          type: string
          description: Environment context
          examples:
          - env_8888
        inspectorId:
          type: string
          description: Inspector context (for dataprint jobs)
          examples:
          - inspector_13
        callbackUrl:
          type: string
          format: uri
          description: Optional callback URL for completion notification
          examples:
          - https://partner.example.com/webhooks/dataprint-complete
        callbackAttempts:
          type: integer
          description: Number of callback delivery attempts made
          examples:
          - 1
        callbackLastAttempt:
          type: string
          format: date-time
          description: Last callback attempt timestamp
          examples:
          - '2024-02-06T10:30:15Z'
        result:
          type: object
          description: Job result (populated when status is completed or failed)
          additionalProperties: true
          examples:
          - accepted: true
            environmentsProcessed: 1
            assetsProcessed: 5
            warnings: []
            errors: []
        error:
          type: object
          description: Error details (populated when status is failed)
          properties:
            code:
              type: string
              examples:
              - VALIDATION_ERROR
            message:
              type: string
              examples:
              - Invalid JSONPath in assets.uniqueIdPath
            details:
              type: object
              additionalProperties: true
        createdAt:
          type: string
          format: date-time
          description: Job creation timestamp (UTC, ISO 8601)
          examples:
          - '2024-02-06T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp (UTC, ISO 8601)
          examples:
          - '2024-02-06T10:30:15Z'
        startedAt:
          type: string
          format: date-time
          description: Processing start timestamp
          examples:
          - '2024-02-06T10:30:01Z'
        completedAt:
          type: string
          format: date-time
          description: Completion timestamp
          examples:
          - '2024-02-06T10:30:15Z'
        estimatedCompletionAt:
          type: string
          format: date-time
          description: Estimated completion time
          examples:
          - '2024-02-06T10:32:00Z'
    metric:
      type: object
      additionalProperties: false
      required:
      - metricId
      - name
      - inspectorId
      - updatedAt
      properties:
        metricId:
          type: string
          description: Unique metric identifier
          examples:
          - metric_1
        uuid:
          type: string
          format: uuid
          description: UUID for external reference
          examples:
          - aa4eef4d-3dc5-4b3d-9d8a-00c1d9b68065
        name:
          type: string
          description: Metric name
          examples:
          - 'Active Directory: Count of Joined Computers'
          maxLength: 255
        description:
          type: string
          description: Detailed metric description
          examples:
          - Number of computers joined to this Active Directory domain (servers and
            workstations)
        inspectorId:
          type: string
          description: Inspector this metric applies to
          examples:
          - inspector_13
        environmentId:
          type: string
          description: Environment scope (null for global metrics)
          examples:
          - env_8888
        queries:
          type: array
          description: JMESPath queries for different inspector versions
          items:
            type: object
            required:
            - query
            - inspectorVersionId
            properties:
              query:
                type: string
                description: JMESPath expression to evaluate
                examples:
                - length(Computers)
              inspectorVersionId:
                type: string
                description: Inspector version this query applies to
                examples:
                - version_26
        metricDisplay:
          type: boolean
          description: Whether metric is displayed in UI by default
          examples:
          - true
          default: true
        changesEnabled:
          type: boolean
          description: Whether change detection is enabled for this metric
          examples:
          - true
          default: false
        isCustom:
          type: boolean
          description: Custom metric (true) vs system-provided (false)
          examples:
          - false
        hasActiveAlertRule:
          type: boolean
          description: Whether this metric has active alert rules
          examples:
          - true
        belongsToChangeRule:
          type: boolean
          description: Whether this metric belongs to a change detection rule
          examples:
          - false
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (UTC, ISO 8601)
          examples:
          - '2021-09-10T19:21:03Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp (UTC, ISO 8601)
          examples:
          - '2024-02-06T10:30:00Z'
    metricCreateRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - inspectorId
      - queries
      properties:
        name:
          type: string
          maxLength: 255
          examples:
          - 'Active Directory: Count of Joined Computers'
        description:
          type: string
          examples:
          - Number of computers joined to this Active Directory domain
        inspectorId:
          type: string
          examples:
          - inspector_13
        environmentId:
          type: string
          description: Scope to specific environment (omit for global)
          examples:
          - env_8888
        queries:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - query
            - inspectorVersionId
            properties:
              query:
                type: string
                examples:
                - length(Computers)
              inspectorVersionId:
                type: string
                examples:
                - version_26
        metricDisplay:
          type: boolean
          default: true
        changesEnabled:
          type: boolean
          default: false
    metricPatchRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
        queries:
          type: array
          items:
            type: object
            required:
            - query
            - inspectorVersionId
            properties:
              query:
                type: string
              inspectorVersionId:
                type: string
        metricDisplay:
          type: boolean
        changesEnabled:
          type: boolean
    metricEvaluateRequest:
      type: object
      additionalProperties: false
      required:
      - metrics
      - pagination
      properties:
        metrics:
          type: array
          description: Metric IDs or UUIDs to evaluate
          minItems: 1
          items:
            type: string
          examples:
          - - metric_1
            - aa4eef4d-3dc5-4b3d-9d8a-00c1d9b68065
        filters:
          type: array
          description: Filter results by environment, system, etc.
          items:
            type: object
            required:
            - field
            - op
            - value
            properties:
              field:
                type: string
                enum:
                - environmentId
                - environmentName
                - systemId
                - systemName
                - inspectorId
                examples:
                - environmentId
              op:
                type: string
                enum:
                - equal_to
                - contains
                - does_not_contain
                - matches_exactly
                - starts_with
                - ends_with
                examples:
                - equal_to
              value:
                oneOf:
                - type: string
                - type: integer
                - type: array
                  items:
                    oneOf:
                    - type: string
                    - type: integer
                examples:
                - env_8888
        sorting:
          type: array
          items:
            type: object
            required:
            - field
            - direction
            properties:
              field:
                type: string
                enum:
                - metricName
                - environmentName
                - systemName
                - metricId
                - environmentId
                - systemId
                examples:
                - environmentName
              direction:
                type: string
                enum:
                - asc
                - desc
                examples:
                - asc
        pagination:
          type: object
          required:
          - limit
          - offset
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 1000
              examples:
              - 25
            offset:
              type: integer
              minimum: 0
              examples:
              - 0
        date:
          type: string
          format: date-time
          description: Evaluation date (defaults to latest dataprint if omitted)
          examples:
          - '2024-02-06T00:00:00Z'
    objectCapabilities:
      type: object
      additionalProperties: false
      required:
      - object
      - filterableFields
      - expandableFields
      - events
      properties:
        object:
          type: string
          enum:
          - alerts
          - assets
          - dataprints
          - environments
          - identities
          - inspectors
          - jobs
          - metrics
          - systems
          description: Object type
        filterableFields:
          type: array
          items:
            type: string
          description: Fields that can be used in RSQL filter queries
        expandableFields:
          type: array
          items:
            type: string
          description: Fields that can be expanded in responses via the expand parameter
        sortableFields:
          type: array
          items:
            type: string
          description: Fields that can be used for sorting via the sort parameter
        events:
          type: array
          items:
            type: string
            enum:
            - created
            - updated
            - deleted
            - submitted
            - completed
            - failed
            - evaluated
            - inspected
          description: Webhook events supported for this object type
    webhookDeliveryMode:
      type: string
      enum:
      - full
      - diff
      description: '- full: Complete object sent in each webhook

        - diff: Only changed fields sent in webhook

        '
    webhookObject:
      type: string
      enum:
      - alerts
      - assets
      - dataprints
      - environments
      - identities
      - inspectors
      - metrics
      - systems
      description: Object type to subscribe to
    webhookObjectSubscription:
      type: object
      additionalProperties: false
      required:
      - object
      - events
      properties:
        object:
          $ref: '#/components/schemas/webhookObject'
        events:
          type: array
          items:
            type: string
            enum:
            - created
            - updated
            - deleted
            - submitted
            - completed
            - failed
            - evaluated
            - inspected
          description: >
            Events to subscribe to. Available events vary by object type:
            alerts/assets/environments/identities/inspectors support created/updated/deleted;
            dataprints support submitted/completed/failed;
            metrics support created/updated/deleted/evaluated;
            systems support created/updated/inspected.
        filter:
          type: string
          description: RSQL filter expression to narrow which events are delivered
        expand:
          type: array
          items:
            type: string
          description: Fields to expand in webhook payload
        delivery:
          type: object
          additionalProperties: false
          required:
          - mode
          properties:
            mode:
              $ref: '#/components/schemas/webhookDeliveryMode'
            includeSnapshot:
              type: string
              enum:
              - none
              - minimal
              - full
              default: minimal
              description: '- none: No snapshot included

                - minimal: Include core fields only

                - full: Include complete object snapshot

                '
    webhookSubscription:
      type: object
      additionalProperties: false
      required:
      - subscriptionId
      - status
      - endpointUrl
      - objects
      - createdAt
      - updatedAt
      properties:
        subscriptionId:
          type: string
          description: Unique subscription identifier
        name:
          type: string
          description: Human-readable subscription name
        status:
          type: string
          enum:
          - enabled
          - disabled
          description: Subscription status
        endpointUrl:
          type: string
          format: uri
          description: HTTPS URL to receive webhook POSTs
        objects:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/webhookObjectSubscription'
          description: Object subscriptions
        metricThresholds:
          type: array
          items:
            $ref: '#/components/schemas/metricThreshold'
          description: Metric threshold conditions (if any)
        createdAt:
          type: string
          format: date-time
          description: Subscription creation timestamp (UTC, ISO 8601)
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp (UTC, ISO 8601)
    webhookSubscriptionCreateRequest:
      type: object
      additionalProperties: false
      required:
      - endpointUrl
      - secret
      - objects
      properties:
        name:
          type: string
        endpointUrl:
          type: string
          format: uri
          description: HTTPS URL to receive webhook POSTs
        secret:
          type: string
          description: Secret for HMAC signature verification
        objects:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/webhookObjectSubscription'
        metricThresholds:
          type: array
          description: >
            Threshold conditions for metric-based notifications. When a metric.evaluated
            event fires and the value matches a condition, the webhook is delivered.
            Requires an objects entry watching metrics with the evaluated event.
          items:
            $ref: '#/components/schemas/metricThreshold'
    metricThreshold:
      type: object
      additionalProperties: false
      required:
      - metricId
      - condition
      - value
      properties:
        metricId:
          type: string
          description: Metric to watch
          examples:
          - metric_offline_count
        condition:
          type: string
          enum:
          - greater_than
          - greater_than_or_equal
          - less_than
          - less_than_or_equal
          - equal_to
          - not_equal_to
          - changed
          - changed_by_more_than
          description: >
            Threshold condition to evaluate against the metric value.
            "changed" fires whenever the value differs from the previous evaluation.
            "changed_by_more_than" fires when the absolute change exceeds the threshold.
        value:
          description: Threshold value to compare against (type depends on metric)
          oneOf:
          - type: number
          - type: string
          - type: boolean
          examples:
          - 5
          - true
        cooldownMinutes:
          type: integer
          minimum: 0
          default: 60
          description: >
            Minutes to suppress repeated notifications after the threshold fires.
            Set to 0 for immediate re-notification on every evaluation.
          examples:
          - 60
    webhookSubscriptionPatchRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - enabled
          - disabled
        endpointUrl:
          type: string
          format: uri
        secret:
          type: string
          description: Update webhook secret for signature verification
        objects:
          type: array
          items:
            $ref: '#/components/schemas/webhookObjectSubscription'
        metricThresholds:
          type: array
          items:
            $ref: '#/components/schemas/metricThreshold'
    webhookPayload:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - createdAt
      - data
      properties:
        id:
          type: string
          description: Unique webhook event ID
          examples:
          - evt_1234567890
        type:
          type: string
          description: Event type (object.event format)
          examples:
          - alert.created
          enum:
          - alert.created
          - alert.updated
          - alert.deleted
          - asset.created
          - asset.updated
          - asset.deleted
          - dataprint.submitted
          - dataprint.completed
          - dataprint.failed
          - environment.created
          - environment.updated
          - environment.deleted
          - identity.created
          - identity.updated
          - identity.deleted
          - inspector.created
          - inspector.updated
          - inspector.deleted
          - metric.created
          - metric.updated
          - metric.deleted
          - metric.evaluated
          - system.created
          - system.updated
          - system.inspected
        createdAt:
          type: string
          format: date-time
          description: When the event occurred (UTC, ISO 8601)
          examples:
          - '2024-02-06T10:30:00Z'
        data:
          type: object
          required:
          - object
          properties:
            object:
              description: >
                The affected object. Type depends on the event — could be an alert,
                asset, dataprint, environment, identity, inspector, metric, or system.
              oneOf:
              - $ref: '#/components/schemas/alert'
              - $ref: '#/components/schemas/asset'
              - $ref: '#/components/schemas/dataprint'
              - $ref: '#/components/schemas/environment'
              - $ref: '#/components/schemas/identity'
              - $ref: '#/components/schemas/inspector'
              - $ref: '#/components/schemas/metric'
              - $ref: '#/components/schemas/system'
            previousAttributes:
              type: object
              additionalProperties: true
              description: For update events with diff mode, contains only changed
                fields
            snapshot:
              type: object
              description: Complete object snapshot (if includeSnapshot is not 'none')
              oneOf:
              - $ref: '#/components/schemas/alert'
              - $ref: '#/components/schemas/asset'
              - $ref: '#/components/schemas/dataprint'
              - $ref: '#/components/schemas/environment'
              - $ref: '#/components/schemas/identity'
              - $ref: '#/components/schemas/inspector'
              - $ref: '#/components/schemas/metric'
              - $ref: '#/components/schemas/system'
      examples:
      - id: evt_1234567890
        type: alert.created
        createdAt: '2024-02-06T10:30:00Z'
        data:
          object:
            alertId: alert_7586
            environmentId: env_8888
            name: Critical vulnerability detected
            status: open
            priority: critical
            createdAt: '2024-02-06T10:30:00Z'
            updatedAt: '2024-02-06T10:30:00Z'
    webhookSignatureVerification:
      type: object
      description: 'Webhook signatures for verification.


        Each webhook POST includes these headers:

        - X-Liongard-Signature: HMAC-SHA256 signature of the payload

        - X-Liongard-Timestamp: Unix timestamp of when the webhook was sent


        To verify:

        1. Construct the signed payload: `{timestamp}.{raw_json_body}`

        2. Compute HMAC-SHA256 using your webhook secret

        3. Compare to X-Liongard-Signature header


        Reject webhooks with timestamps older than 5 minutes to prevent replay attacks.

        '
    dataprintJobResponse:
