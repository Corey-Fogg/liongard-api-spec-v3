    inspectorUiConfigField:
      type: object
      additionalProperties: false
      required:
      - name
      - label
      - type
      description: A single credential/config field shown to users when they create
        a launchpoint for this inspector.
      properties:
        name:
          type: string
          description: 'Variable name surfaced on the runtime job (UPPER_SNAKE_CASE
            recommended, e.g. ACME_API_KEY). Must be unique within the inspector.

            '
          pattern: '^[A-Z][A-Z0-9_]*$'
          maxLength: 100
          examples:
          - ACME_API_KEY
        label:
          type: string
          description: Human-readable label rendered in the launchpoint form.
          examples:
          - API Key
        type:
          type: string
          enum:
          - string
          - number
          - bool
          - options
          - secret
          description: Input control type. `secret` is identical to `string` but
            stored encrypted and masked in the UI.
        options:
          type: array
          description: Allowed values when `type` is `options`.
          items:
            type: string
        required:
          type: boolean
          default: false
          description: Whether the user must populate this field before the launchpoint
            can be saved.
        secure:
          type: boolean
          default: false
          description: 'When true, the value is stored encrypted, never returned
            on GET, and masked in logs. Required for API keys, passwords, and
            shared secrets. Mutually compatible with any `type`.

            '
        parent:
          type: boolean
          default: false
          description: 'When true the field is collected on the parent launchpoint
            only and copied into discovered child launchpoints. Use for credentials
            that are shared across an MSP''s entire customer base (the MSP API key
            or OAuth client) rather than per-customer values (a customer-specific
            tenant id).

            '
        help:
          type: string
          description: 'Inline help text — typically a short pointer to where the
            value lives in the vendor''s UI (e.g. "Command Center → Settings → API
            Keys").

            '
        default:
          oneOf:
          - type: string
          - type: number
          - type: boolean
          description: Optional default value pre-filled in the launchpoint form.
        placeholder:
          type: string
          description: Optional placeholder text for the input.
        validationRegex:
          type: string
          description: Optional ECMAScript regex evaluated client-side before save.
        sortOrder:
          type: integer
          description: Render order in the form; lower numbers appear first.
    inspectorUiConfigTemplate:
