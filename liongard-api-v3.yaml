          items:
            $ref: '#/components/schemas/inspectorRuleCreateRequest'
    inspectorManifestImportRequest:
      type: object
      additionalProperties: false
      required:
      - manifest
      properties:
        manifest:
          $ref: '#/components/schemas/inspectorManifest'
        dryRun:
          type: boolean
          default: false
          description: 'When true, the server validates the manifest and returns
            the call pipeline it would execute (with rendered payloads) without
            mutating any state. Use this to preview an import.

            '
        upsert:
          type: boolean
          default: false
          description: 'When true and an inspector with the same `definition.name`
            already exists, the existing inspector is patched and its
            sub-resources are replaced instead of failing with 409.

            '
        stopOnError:
          type: boolean
          default: true
          description: 'When true, the first failing call short-circuits the
            pipeline. When false, the pipeline continues and the per-call
            results record both successes and failures.

            '
        environmentId:
          type: string
          description: 'Optional environment scope for the dataprint config
            section. Required only when `manifest.dataprintMetadata` is
            present.

            '
    inspectorManifestImportResponse:
      type: object
      additionalProperties: false
      required:
      - inspectorId
      - callPipeline
      properties:
        inspectorId:
          type: string
          description: ID of the inspector that was created or updated.
        dryRun:
          type: boolean
        callPipeline:
          type: array
          description: 'Ordered record of every API call the import made (or
            would make, when `dryRun=true`). Each entry mirrors the actual
            sub-resource endpoint contract — same operationId, method, path, and
            payload that a caller could have issued by hand.

            '
          items:
            $ref: '#/components/schemas/inspectorManifestCall'
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - step
            - message
            properties:
              step:
                type: integer
              operationId:
                type: string
              message:
                type: string
    inspectorManifestCall:
      type: object
      additionalProperties: false
      required:
      - step
      - operationId
      - method
      - path
      properties:
        step:
          type: integer
          description: 1-based position in the pipeline.
        operationId:
          type: string
          description: OpenAPI operationId of the endpoint invoked.
          examples:
          - upsertInspectorAuthentication
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        path:
          type: string
          description: Concrete request path with path-parameters resolved.
          examples:
          - /v3/inspectors/inspector_13/authentication
        payload:
          description: Request body as it would be sent. Secrets in ui-config
            fields are not redacted in dryRun mode (the caller already supplied
            them) but are masked on non-dryRun responses.
          oneOf:
          - type: object
            additionalProperties: true
          - type: array
            items: {}
          - type: 'null'
        status:
          type: integer
          description: HTTP status code returned (absent in `dryRun`).
        resourceId:
          type: string
          description: ID of the resource created or updated by this call (when
            applicable).
        durationMs:
          type: integer
