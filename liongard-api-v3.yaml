    inspectorDiscoveryConfig:
      type: object
      additionalProperties: false
      required:
      - inspectorId
      - mode
      - updatedAt
      description: 'Multi-tenancy configuration. When `mode=parentChild`, parent
        launchpoints enumerate environment-mappable objects (customers, devices,
        clusters…) from the named discovery endpoint and emit the Discovered[]
        list that creates child launchpoints.

        '
      properties:
        inspectorId:
          type: string
        mode:
          type: string
          enum:
          - singleLaunchpoint
          - parentChild
          default: singleLaunchpoint
        discoverySourceEndpoint:
          type: string
          description: Name of an endpoint with `role=discovery` whose response
            list drives Discovered[] emission. Required when
            `mode=parentChild`.
        environmentSearchPath:
          type: string
          description: 'JMESPath (relative to a discovery item) to the value
            placed in `Discovered[].EnvironmentSearch`. Matches against a
            Liongard environment name during discovery.

            '
          examples:
          - name
        aliasTemplate:
          type: string
          description: 'Template for `Discovered[].Alias`, e.g. `"Pax8 -
            {name}"`. `{x}` placeholders reference fields on the discovery
            item.

            '
          examples:
          - Pax8 - {name}
        configMapping:
          type: object
          additionalProperties:
            type: string
          description: 'Map of ui-config field name → JMESPath into the discovery
            item. Each entry is copied into the Discovered[].Config of every
            emitted child.

            '
          examples:
          - PAX8_COMPANY_ID: id
        candidateObjectAnalysis:
          type: string
          description: 'Required when `mode=singleLaunchpoint`. A short
            justification listing each candidate object type that was considered
            (customers, devices, clusters, users…) and why none qualifies as an
            environment-mappable surface. Prevents accidental flat designs for
            APIs that do have a discovery surface.

            '
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
    inspectorDiscoveryConfigUpsertRequest:
      type: object
      additionalProperties: false
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - singleLaunchpoint
          - parentChild
        discoverySourceEndpoint:
          type: string
        environmentSearchPath:
          type: string
        aliasTemplate:
          type: string
        configMapping:
          type: object
          additionalProperties:
            type: string
        candidateObjectAnalysis:
          type: string
